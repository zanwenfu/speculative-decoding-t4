name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and saved-results commands
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The library and the CLIs are standard library only; no torch or CUDA.
      - name: Install
        run: pip install "pytest>=8.0"

      - name: Pytest
        run: python -m pytest tests/ -q

      # Every command the README lists must run against the saved measurements.
      - name: README commands
        run: |
          python -m src.bench.probe_percall
          python -m src.bench.bench_tree --tree-config 16x3 --version v2 --show-dp
          python -m src.bench.bench_tree --tree-config 16x3 --version v3
          python -m src.bench.bench_linear
          python -m src.bench.advise --hw T4 --draft 1B --target 3B
